steps:
  unit-tests:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    when:
      event: push
      path:
        - "src/**"
        - "tests/**"
    commands:
      - uv sync --dev
      - uv run pytest -m "not integration" -v

  integration-tests:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    when:
      event: pull_request
      branch:
        - main
        - dev
      path:
        - "src/**"
        - "tests/**"
    environment:
      WRENN_API_KEY:
        from_secret: WRENN_API_KEY
    commands:
      - uv sync --dev
      - uv run pytest -m integration -v
